<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Tools</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    }
    main { width: min(920px, calc(100% - 32px)); padding: 56px 0; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 52px); letter-spacing: -.04em; }
    .lead { margin: 14px 0 34px; color: var(--muted); font-size: 17px; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .card {
      display: block;
      min-height: 220px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #c7d2fe;
      box-shadow: 0 18px 45px rgba(17, 24, 39, .09);
    }
    .icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 34px;
      border-radius: 14px;
      background: #eef2ff;
      color: var(--accent);
      font-weight: 900;
    }
    .card h2 { margin: 0 0 10px; font-size: 24px; }
    .card p { margin: 0; color: var(--muted); line-height: 1.65; }
    .path { margin-top: 18px; color: var(--accent); font-size: 13px; font-weight: 700; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GOYUNJAE · WEB TOOLS</p>
    <h1>프로그램 선택</h1>
    <p class="lead">사용할 기능을 선택하세요. 각 프로그램은 독립된 폴더와 주소로 관리됩니다.</p>

    <section class="grid" aria-label="프로그램 목록">
      <a class="card" href="./graph/">
        <div class="icon">G</div>
        <h2>그래프 생성기</h2>
        <p>Excel 또는 직접 입력한 데이터를 기반으로 보고서용 그래프를 생성합니다.</p>
        <div class="path">/graph/ →</div>
      </a>

      <a class="card" href="./excel/">
        <div class="icon">X</div>
        <h2>엑셀 수정기</h2>
        <p>물품취득원장 Excel 파일을 업로드해 BK21 물품 현황 규격으로 자동 정리합니다.</p>
        <div class="path">/excel/ →</div>
      </a>
    </section>
  </main>
</body>
</html>
