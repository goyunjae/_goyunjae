name: Graph smoke test

on:
  pull_request:
    paths:
      - "graph/**"
      - ".github/workflows/graph-smoke-test.yml"
  push:
    branches:
      - main
    paths:
      - "graph/**"
      - ".github/workflows/graph-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run graph smoke tests
        run: node graph/tests/smoke-test.js
