name: Build KeyLoop for Windows
on:
  push:
    branches: [main]
    paths: ['keyloop/**', '.github/workflows/keyloop-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: keyloop-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run self-tests
        working-directory: keyloop
        shell: cmd
        run: build.cmd
      - name: Render UI preview
        shell: pwsh
        working-directory: keyloop
        run: |
          $process = Start-Process dist/KeyLoop.exe -ArgumentList --preview -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (!(Test-Path KeyLoop-preview.png)) { throw "UI preview missing" }
      - name: Create package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force keyloop/package | Out-Null
          Copy-Item keyloop/dist/KeyLoop.exe keyloop/package/
          Copy-Item keyloop/README.md keyloop/package/
          Copy-Item keyloop/Setup.cmd keyloop/package/
          Copy-Item keyloop/Disconnect.cmd keyloop/package/
          Compress-Archive -Path keyloop/package/* -DestinationPath KeyLoop-Windows-x64.zip
          Get-FileHash KeyLoop-Windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  KeyLoop-Windows-x64.zip" } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KeyLoop-Windows-x64
          path: |
            KeyLoop-Windows-x64.zip
            SHA256SUMS.txt
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view keyloop-v1.0.1 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create keyloop-v1.0.1 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "KeyLoop 1.0.1 · Windows" --notes-file keyloop/README.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload keyloop-v1.0.1 KeyLoop-Windows-x64.zip SHA256SUMS.txt keyloop/KeyLoop-preview.png --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
